name: Build

# Builds TrafficTarget.exe on every push / pull request.
# Releases: when the version in src/Program.cs (AppInfo.Version) has no release yet,
# a push to main publishes release v<version> with the exe attached and that
# version's CHANGELOG section as the notes. Pushing a v* tag does the same.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with the C# compiler built into Windows
        shell: cmd
        run: build.bat

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item TrafficTarget.exe, README.md, LICENSE, CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath TrafficTarget-win.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: TrafficTarget
          path: |
            TrafficTarget.exe
            TrafficTarget-win.zip

      - name: Read version and release notes
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src/Program.cs -Pattern 'Version = "([^"]+)"').Matches[0].Groups[1].Value
          $exists = [bool](git tag --list "v$v")
          "version=$v" >> $env:GITHUB_OUTPUT
          "exists=$exists" >> $env:GITHUB_OUTPUT
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($v))[^\r\n]*\r?\n(.*?)(?=^## |\z)")
          $notes = $m.Groups[1].Value.Trim()
          $notes += "`n`n**Download:** ``TrafficTarget.exe`` (single file, no installer). Windows 10/11 with .NET Framework 4.x (built in)."
          $notes += "`nThe executable is not code-signed: if SmartScreen warns, choose *More info -> Run anyway*."
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish release
        if: >-
          github.event_name == 'push' &&
          (startsWith(github.ref, 'refs/tags/v') ||
           (github.ref == 'refs/heads/main' && steps.ver.outputs.exists == 'False'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Traffic Target ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            TrafficTarget.exe
            TrafficTarget-win.zip
