name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the C# compiler built into Windows
        shell: cmd
        run: build.bat

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item TrafficTarget.exe, README.md, LICENSE, CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath TrafficTarget-win.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: TrafficTarget
          path: |
            TrafficTarget.exe
            TrafficTarget-win.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TrafficTarget.exe
            TrafficTarget-win.zip
          generate_release_notes: true
